<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SnapVault</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SnapVault">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f4f5fa;--surface:#fff;--surface-2:#eef0f7;--text:#0f1530;--muted:#667089;--border:#e2e6f0;
  --accent:#4f46e5;--accent-hi:#6366f1;--accent-soft:rgba(79,70,229,.10);
  --danger:#e11d48;--danger-soft:rgba(225,29,72,.10);--ok:#059669;--ok-soft:rgba(5,150,105,.12);--warn:#b45309;--warn-soft:rgba(245,158,11,.16);
  --r:16px;--shadow:0 1px 2px rgba(15,21,48,.05),0 10px 30px rgba(15,21,48,.07);
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
  --nav-h:64px;--side-w:248px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0a0e1a;--surface:#121829;--surface-2:#1a2238;--text:#e9edf8;--muted:#8d99b5;--border:#232c47;
  --accent:#6366f1;--accent-hi:#818cf8;--accent-soft:rgba(129,140,248,.15);
  --danger:#fb4d73;--danger-soft:rgba(251,77,115,.14);--ok:#34d399;--ok-soft:rgba(52,211,153,.14);--warn:#fbbf24;--warn-soft:rgba(251,191,36,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35)}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Ethiopic",Nyala,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;touch-action:manipulation}
body.noscroll{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
[hidden]{display:none!important}
a{color:var(--accent)}
h1{font-size:26px;line-height:1.2;letter-spacing:-.02em;font-weight:750}
h2{font-size:22px;letter-spacing:-.01em;font-weight:700}
h3{font-size:17px;font-weight:650}
.muted{color:var(--muted)}.grow{flex:1}.sub{color:var(--muted);font-size:14px}
.ic{width:20px;height:20px;flex:none}
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;font-weight:600;background:var(--surface);border:1px solid var(--border);transition:transform .08s,background .15s,border-color .15s,box-shadow .15s;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--accent-hi)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff;box-shadow:0 6px 16px -6px var(--accent)}
.btn.primary:hover:not(:disabled){background:var(--accent-hi)}
.btn.danger{background:var(--danger);border-color:transparent;color:#fff}
.btn.danger-o{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover:not(:disabled){background:var(--surface-2)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.lg{min-height:52px;font-size:16px;border-radius:14px}
.btn.block{width:100%}
.btn.icon{width:44px;padding:0}
.btn.sm.icon{width:36px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.input{width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);transition:border-color .15s,box-shadow .15s}
.input:focus{outline:none;border-color:var(--accent-hi);box-shadow:0 0 0 4px var(--accent-soft)}
.input.sel{width:auto;min-height:44px;padding-right:8px}
.pw{position:relative}.pw .input{padding-right:70px}
.pw button{position:absolute;right:6px;top:6px;height:36px;padding:0 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.alert{padding:11px 14px;border-radius:12px;font-size:14px;margin-bottom:14px;background:var(--danger-soft);color:var(--danger)}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:650;background:var(--surface-2);color:var(--muted)}
.b-accent{background:var(--accent-soft);color:var(--accent-hi)}.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--danger-soft);color:var(--danger)}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;font-size:14px;color:#fff;background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--surface-2);overflow-x:auto}
.seg button{flex:1;min-height:40px;padding:0 14px;border-radius:10px;font-weight:600;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg em{font-style:normal;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.seg button.on em{background:var(--accent-soft);color:var(--accent-hi)}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#6366f1,#7c3aed);box-shadow:0 8px 20px -8px #6366f1;flex:none}
.brand{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:750;letter-spacing:-.02em}

/* ---------- auth ---------- */
.auth{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1fr}
.auth-hero{display:none;position:relative;overflow:hidden;color:#fff;padding:44px 52px;background:linear-gradient(140deg,#272370,#4f46e5 55%,#7c3aed);flex-direction:column;justify-content:space-between}
.auth-hero::before,.auth-hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.07)}
.auth-hero::before{width:520px;height:520px;right:-160px;top:-120px}
.auth-hero::after{width:380px;height:380px;left:-120px;bottom:-140px}
.auth-hero>*{position:relative;z-index:1}
.auth-hero .logo{background:rgba(255,255,255,.18);box-shadow:none}
.hero-copy h2{font-size:38px;line-height:1.12;letter-spacing:-.03em;margin-bottom:16px}
.hero-copy p{font-size:17px;opacity:.85;max-width:460px}
.hero-list{list-style:none;margin-top:28px;display:grid;gap:14px}
.hero-list li{display:flex;gap:12px;align-items:center;font-weight:500}
.hero-list .ic{padding:9px;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.15)}
.auth-main{display:grid;place-items:center;padding:calc(24px + var(--safe-t)) 20px calc(24px + var(--safe-b))}
.auth-card{width:min(440px,100%)}
.auth-card .brand{margin-bottom:28px}
.auth-card h1{margin-bottom:6px}
.auth-card .seg{margin:22px 0 22px}
.auth-card .reg{display:none}
.auth-card[data-mode=register] .reg{display:block}
.fine{margin-top:18px;font-size:13px;color:var(--muted);text-align:center}
.demo{margin-top:22px;padding:0 14px;border:1px dashed var(--border);border-radius:14px;background:var(--surface)}
.demo summary{display:flex;align-items:center;gap:8px;min-height:48px;font-weight:650;font-size:14px;cursor:pointer;list-style:none}
.demo summary::-webkit-details-marker{display:none}
.demo summary::after{content:"▾";margin-left:auto;color:var(--muted);transition:transform .15s}
.demo[open] summary::after{transform:rotate(180deg)}
.demo[open] summary{border-bottom:1px solid var(--border);margin-bottom:6px}
.demo-row{display:flex;align-items:center;gap:10px;padding:8px 0}
.demo-row .avatar{width:36px;height:36px;font-size:13px}
.demo-row .who{flex:1;min-width:0;line-height:1.3}.demo-row .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.demo-row .who span{font-size:12px;color:var(--muted)}
.demo-log{display:grid;gap:4px;margin:8px 0;font-size:13px}
.demo-log .ok{color:var(--ok)}.demo-log .warn{color:var(--warn)}.demo-log .bad{color:var(--danger)}
.demobar{padding:8px 16px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:600;text-align:center}
.demobar button{color:inherit;text-decoration:underline;font-weight:700}
@media (min-width:900px){.auth{grid-template-columns:1.1fr 1fr}.auth-hero{display:flex}.auth-card .brand{display:none}}
.center{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px}
.gate{width:min(460px,100%);text-align:center;padding:36px 28px}
.gate .big{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;background:var(--warn-soft);color:var(--warn)}
.gate .big .ic{width:34px;height:34px}.gate .big.bad{background:var(--danger-soft);color:var(--danger)}
.gate h2{margin-bottom:8px}.gate p{color:var(--muted);margin-bottom:22px}
.gate .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ---------- shell ---------- */
.shell{min-height:100vh;min-height:100dvh}
.side{display:none}
.main{min-height:100vh;min-height:100dvh}
.view{max-width:1240px;margin:0 auto;padding:calc(18px + var(--safe-t)) 16px calc(var(--nav-h) + var(--safe-b) + 28px)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:flex-end;justify-content:space-around;padding:6px 6px var(--safe-b);background:var(--surface);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--border);height:calc(var(--nav-h) + var(--safe-b))}
.tab{position:relative;flex:1;max-width:120px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);border-radius:12px}
.tab.on{color:var(--accent-hi)}
.tab.tab-cam{justify-content:flex-start}
.fab{width:58px;height:58px;margin-top:-22px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#6366f1,#7c3aed);box-shadow:0 10px 24px -6px #6366f1;border:4px solid var(--bg)}
.fab .ic{width:26px;height:26px}
.dot{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--danger);color:#fff;font-size:11px;font-style:normal;font-weight:700;display:grid;place-items:center}
@media (min-width:800px){
  .tabbar{display:none}
  .side{display:flex;flex-direction:column;gap:18px;position:fixed;inset:0 auto 0 0;width:var(--side-w);padding:calc(22px + var(--safe-t)) 16px calc(18px + var(--safe-b)) calc(16px + var(--safe-l));background:var(--surface);border-right:1px solid var(--border);z-index:20}
  .main{margin-left:var(--side-w)}
  .view{padding:calc(30px + var(--safe-t)) 34px 60px}
  .side nav{display:grid;gap:4px}
  .nav{position:relative;display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;border-radius:12px;font-weight:600;color:var(--muted);text-align:left}
  .nav:hover{background:var(--surface-2)}.nav.on{background:var(--accent-soft);color:var(--accent-hi)}
  .nav .dot{position:static;margin-left:auto}
  .side-user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--surface-2)}
  .side-user div{min-width:0;flex:1}.side-user b,.side-user small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side-user small{color:var(--muted);font-size:12px}
}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.ph-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
@media (max-width:799px){.hide-sm{display:none!important}}
@media (max-width:599px){.lbl{display:none}}

/* ---------- gallery ---------- */
.day{display:flex;align-items:baseline;gap:10px;margin:24px 0 10px;font-weight:700}
.day small{font-weight:500;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
@media (min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:12px}}
@media (min-width:1100px){.grid{grid-template-columns:repeat(auto-fill,minmax(204px,1fr))}}
.tile{position:relative;display:block;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--surface-2);transition:transform .15s}
.tile:hover{transform:translateY(-2px)}
.tile img{width:100%;height:100%;object-fit:cover;display:block;-webkit-touch-callout:none;user-select:none;transition:transform .15s}
.tile .chk{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:50%;display:none;place-items:center;background:rgba(0,0,0,.35);border:2px solid #fff;color:transparent}
.tile .chk .ic{width:15px;height:15px;stroke-width:3}
.selecting .tile .chk{display:grid}
.tile.sel{outline:3px solid var(--accent-hi);outline-offset:-3px}
.tile.sel img{transform:scale(.9);border-radius:10px}
.tile.sel .chk{background:var(--accent);color:#fff;border-color:var(--accent)}
.tile .vbadge{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.55);backdrop-filter:blur(6px)}
.tile .vbadge .ic{width:14px;height:14px;fill:currentColor;margin-left:2px}
.tile .own{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 7px;font-size:12px;font-weight:600;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65));text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selbar{position:sticky;top:calc(8px + var(--safe-t));z-index:15;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;margin-bottom:12px;border-radius:16px;background:var(--surface);border:1px solid var(--accent-hi);box-shadow:var(--shadow)}
.empty{text-align:center;padding:64px 20px;color:var(--muted)}
.empty .ring{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-hi)}
.empty .ring .ic{width:38px;height:38px}
.empty h3{color:var(--text);margin-bottom:6px}.empty p{margin-bottom:20px}
.sk{border-radius:14px;aspect-ratio:1;background:linear-gradient(90deg,var(--surface-2),var(--border),var(--surface-2));background-size:200% 100%;animation:sh 1.3s infinite linear}
@keyframes sh{to{background-position:-200% 0}}
.more{height:60px;display:grid;place-items:center;color:var(--muted);font-size:13px}

/* ---------- members / account ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{padding:16px 18px}.stat b{display:block;font-size:26px;letter-spacing:-.02em}.stat span{font-size:13px;color:var(--muted)}
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.tools .seg{flex:0 1 auto}.tools .input{flex:1;min-width:200px;max-width:340px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.mcard{padding:16px;display:flex;flex-direction:column;gap:14px}
.mhead{display:flex;gap:12px;align-items:center}
.mhead>div{min-width:0}.mhead b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mhead small{color:var(--muted)}
.mmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.mact{display:flex;gap:6px;flex-wrap:wrap}
.mact .btn.sm{padding:0 10px}.mact .btn.sm.icon{width:36px;padding:0}
.grid2{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:860px){.grid2{grid-template-columns:1fr 1fr}}
.prof{display:flex;gap:16px;align-items:center;margin-bottom:16px}.prof .avatar{width:64px;height:64px;font-size:22px}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;z-index:70;background:#05080f;color:#fff;display:flex;flex-direction:column}
.lb-top{display:flex;align-items:center;gap:12px;padding:calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 10px calc(12px + var(--safe-l))}
.lb-meta{flex:1;min-width:0}.lb-meta b,.lb-meta span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-meta span{font-size:13px;opacity:.7}
.lbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#fff;flex:none}
.lbtn:hover{background:rgba(255,255,255,.2)}
.lb-stage{position:relative;flex:1;min-height:0;display:grid;grid-template:minmax(0,1fr)/minmax(0,1fr);place-items:center;padding:0 8px}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;transition:opacity .2s,filter .2s}
.lb-stage img.loading{filter:blur(3px);opacity:.85}
.lb-count{font-size:13px;opacity:.7}
.lb-stage video{width:100%;height:100%;object-fit:contain;background:#000;border-radius:6px}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;display:none;transition:opacity .25s}
.lb-nav.prev{left:calc(14px + var(--safe-l))}.lb-nav.next{right:calc(14px + var(--safe-r))}
@media (min-width:600px){.lb-nav{display:grid}}
.lb-bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:12px calc(12px + var(--safe-r)) calc(14px + var(--safe-b)) calc(12px + var(--safe-l))}
.lb-bar .btn{background:rgba(255,255,255,.12);border-color:transparent;color:#fff;text-decoration:none}
.lb-bar .btn.primary{background:var(--accent)}.lb-bar .btn.danger{background:var(--danger)}
/* full-screen (immersive) viewer: the picture fills the screen, controls float on top and fade away */
.lb.full .lb-top,.lb.full .lb-bar{position:absolute;left:0;right:0;z-index:4;transition:opacity .25s,transform .25s}
.lb.full .lb-top{top:0;background:linear-gradient(rgba(0,0,0,.7),transparent)}
.lb.full .lb-bar{bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.lb.full .lb-stage{position:absolute;inset:0;padding:0}
.lb.full .lb-stage img,.lb.full .lb-stage video{border-radius:0}
.lb.full.hide-ui .lb-top{opacity:0;transform:translateY(-14px);pointer-events:none}
.lb.full.hide-ui .lb-bar{opacity:0;transform:translateY(14px);pointer-events:none}
.lb.full.hide-ui .lb-nav{opacity:0;pointer-events:none}
.lb.full.hide-ui{cursor:none}
.lb.full.isvid .lb-bar{bottom:64px;background:none}    /* keeps the action buttons above the player's own control bar */

/* ---------- camera ---------- */
.cam{position:fixed;inset:0;z-index:60;background:#000;color:#fff;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.cam video.mirror{transform:scaleX(-1)}
.cam-thirds{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(to right,transparent calc(33.33% - .5px),rgba(255,255,255,.4) calc(33.33% - .5px) calc(33.33% + .5px),transparent calc(33.33% + .5px) calc(66.66% - .5px),rgba(255,255,255,.4) calc(66.66% - .5px) calc(66.66% + .5px),transparent calc(66.66% + .5px)),
  linear-gradient(to bottom,transparent calc(33.33% - .5px),rgba(255,255,255,.4) calc(33.33% - .5px) calc(33.33% + .5px),transparent calc(33.33% + .5px) calc(66.66% - .5px),rgba(255,255,255,.4) calc(66.66% - .5px) calc(66.66% + .5px),transparent calc(66.66% + .5px))}
.cam-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.cam-flash.go{animation:fl .28s ease-out}
@keyframes fl{0%{opacity:.85}100%{opacity:0}}
.cam-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + var(--safe-t)) calc(14px + var(--safe-r)) 14px calc(14px + var(--safe-l));background:linear-gradient(rgba(0,0,0,.6),transparent)}
.cam-tools{display:flex;gap:10px}

  const card = $('#authCard'), err = $('#aErr'), btn = $('#aBtn');

    $('#aTitle').textContent = m === 'login' ? 'Welcome back' : 'Request access';
    $('#aSub').textContent = m === 'login' ? 'Sign in with your username to continue.' : 'Create your account. An administrator must approve it before you can use the app.';
    btn.textContent = m === 'login' ? 'Sign in' : 'Send request';
    $('#fPass').autocomplete = m === 'login' ? 'current-password' : 'new-password';
    $('#aFine').textContent = m === 'login' ? 'No account yet? Tap “Request access”.' : 'You will be able to sign in as soon as an admin approves you.';
  };
  setMode(mode);
  $$('.seg button', card).forEach(b => b.onclick = () => setMode(b.dataset.m));
  $('#pwT').onclick = e => { const p = $('#fPass'); const show = p.type === 'password'; p.type = show ? 'text' : 'password'; e.target.textContent = show ? 'Hide' : 'Show'; };
  const setBusy = b => { btn.disabled = b; btn.innerHTML = b ? '<span class="spin"></span> Please wait…' : (card.dataset.mode === 'login' ? 'Sign in' : 'Send request'); };
  $('#authForm').addEventListener('submit', async e => {
    e.preventDefault(); showErr('');
    const m = card.dataset.mode, username = normUser($('#fUser').value), pass = $('#fPass').value;
    if (!validUser(username)) return showErr('Username must be 3–24 characters: letters, numbers, dot, dash or underscore.');
    if (pass.length < 6) return showErr('Password must be at least 6 characters.');
    let name = '';
    if (m === 'register') {
      name = $('#fName').value.trim();
      if (name.length < 2) return showErr('Please enter your full name.');
      if (pass !== $('#fPass2').value) return showErr('Passwords do not match.');
    }
    setBusy(true);
    try {
      if (m === 'login') {
        const { error } = await sb.auth.signInWithPassword({ email: toEmail(username), password: pass });
        if (error) throw error;
      } else {
        const { data, error } = await sb.auth.signUp({ email: toEmail(username), password: pass, options: { data: { username, full_name: name } } });
        if (error) throw error;
        if (!data.session) { showErr('Account created, but Supabase still requires email confirmation. Turn off "Confirm email" (Authentication → Providers → Email).'); setBusy(false); return; }
        toast('Request sent. An administrator will review it.', 'ok');
      }

    setMode('login'); $('#fUser').value = b.dataset.demo; $('#fPass').value = CONFIG.DEMO_PASSWORD; $('#aBtn').focus();

/* One-click creation of the demo accounts. Uses a throw-away client so the visible sign-in screen is not disturbed.
   The very first account ever created becomes the admin automatically, so the admin is created first. */
async function seedDemoAccounts() {
  const btn = $('#demoSeed'), log = $('#demoLog'), rows = [];
  const say = (t, k = '') => { rows.push(`<div class="${k}">${esc(t)}</div>`); log.innerHTML = rows.join(''); log.hidden = false; };
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Creating…';
  const tmp = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false, storageKey: 'sv-demo-seed' } });
  const pw = CONFIG.DEMO_PASSWORD, accts = CONFIG.DEMO_ACCOUNTS, local = { scope: 'local' };
  try {
    for (const a of accts) {
      const email = toEmail(a.username);
      const si = await tmp.auth.signInWithPassword({ email, password: pw });
      if (!si.error) { say(`@${a.username} already exists`); await tmp.auth.signOut(local); continue; }
      const su = await tmp.auth.signUp({ email, password: pw, options: { data: { username: a.username, full_name: a.name } } });
      if (su.error) {
        if (/already/i.test(su.error.message)) { say(`@${a.username} exists, but with a different password`, 'warn'); continue; }
        throw su.error;
      }
      if (!su.data.session) throw new Error('Supabase still requires email confirmation. Turn off "Confirm email" (Authentication → Providers → Email), then try again.');
      say(`@${a.username} created`, 'ok'); await tmp.auth.signOut(local);
    }
    const adm = accts.find(a => a.role === 'Admin') || accts[0];
    const s = await tmp.auth.signInWithPassword({ email: toEmail(adm.username), password: pw });
    if (s.error) say(`Could not sign in as @${adm.username} to approve the others.`, 'warn');
    else {
      const { data: me } = await tmp.from('profiles').select('role,status').eq('id', s.data.user.id).maybeSingle();
      if (me?.role !== 'admin' || me?.status !== 'approved') {
        say(`@${adm.username} is not an admin, because other accounts existed before it. Sign in with your real admin account, open Members and approve the demo accounts.`, 'warn');
      } else {
        const { data: list } = await tmp.from('profiles').select('id,username,status').in('username', accts.map(a => a.username));
        for (const p of list || []) {
          if (p.status === 'approved') continue;
          const { error } = await tmp.rpc('admin_set_status', { target: p.id, new_status: 'approved' });
          say(error ? `Could not approve @${p.username}: ${error.message}` : `@${p.username} approved`, error ? 'warn' : 'ok');
        }
        say('All set. Tap “Use” next to an account, then Sign in.', 'ok');
      }
      await tmp.auth.signOut(local);
    }
  } catch (e) { say(authErr(e), 'bad'); }
  finally { btn.disabled = false; btn.textContent = 'Create demo accounts'; }
}

/* Live self-test: runs in the browser against the real Supabase + Cloudinary. Nothing is created or changed. */
async function systemCheck() {
  const m = $('#modal'), rows = [];
  m.innerHTML = `<div class="modal-bg"><div class="dlg" style="width:min(540px,100%)" role="dialog" aria-modal="true">
    <h3>System check</h3><p style="margin-bottom:0">Runs from this browser against your real Supabase and Cloudinary. Nothing is created or changed.</p>
    <div class="chk" id="chk"></div><div id="chkSum"></div>
    <div class="dlg-actions"><button type="button" class="btn" data-x>Close</button><button type="button" class="btn primary" id="chkAgain">Run again</button></div></div></div>`;
  const onKey = e => { if (e.key === 'Escape') close(); };
  const close = () => { m.innerHTML = ''; document.removeEventListener('keydown', onKey); };
  document.addEventListener('keydown', onKey);
  $('[data-x]', m).onclick = close;
  $('.modal-bg', m).addEventListener('pointerdown', e => { if (e.target.classList.contains('modal-bg')) close(); });
  const box = $('#chk', m);
  const paint = () => { box.innerHTML = rows.map(r => `<div class="chk-row ${r.s}"><i>${r.s === 'run' ? '<span class="spin"></span>' : r.s === 'ok' ? '✓' : r.s === 'warn' ? '!' : '✕'}</i><div><b>${esc(r.t)}</b>${r.d ? `<span>${esc(r.d)}</span>` : ''}</div></div>`).join(''); };
  const add = t => { const r = { t, s: 'run', d: '' }; rows.push(r); paint(); return (s, d = '') => { r.s = s; r.d = d; paint(); }; };
  const json = async r => { try { return await r.json(); } catch { return {}; } };
  // A "no-cors" request succeeds whenever the server can be reached at all, even if the browser may not read the reply.
  const reach = async url => { try { await fetch(url, { mode: 'no-cors', cache: 'no-store' }); return true; } catch { return false; } };

  async function run() {
    rows.length = 0; paint(); $('#chkSum').innerHTML = ''; $('#chkAgain').disabled = true;
    const U = CONFIG.SUPABASE_URL, H = { apikey: CONFIG.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + CONFIG.SUPABASE_ANON_KEY };
    let done;

    done = add('Camera works on this page');
    if (!window.isSecureContext) done('bad', 'This page is not on https://, so browsers block the camera. Host it over HTTPS (localhost also works).');
    else if (!navigator.mediaDevices?.getUserMedia) done('bad', 'This browser has no camera support.');
    else done('ok', 'Secure page and camera API are available.');

    done = add('How this page is opened');
    if (!navigator.onLine) done('bad', 'This device says it is offline. Connect to the internet, then run the check again.');
    else if (location.protocol === 'file:') done('warn', 'Opened as a file on this device. Host it (for example on Netlify) and open the https:// address instead.');
    else if (window.self !== window.top) done('warn', 'This page is running inside another page or app (an embedded preview). Previews usually block network access. Open the real address directly in the browser.');
    else if (!/^https?:$/.test(location.protocol)) done('warn', `Unusual address (${location.protocol}). Open the real https:// address directly in the browser.`);
    else done('ok', location.origin);

    done = add('Supabase is reachable'); let settings = null;
    try {
      const r = await fetch(U + '/auth/v1/settings', { headers: H });
      if (r.status === 401 || r.status === 403) done('bad', 'The project answered but rejected the key. Copy the "anon public" key again from Project Settings → API.');
      else if (!r.ok) done('bad', `Unexpected answer (HTTP ${r.status}). If the project is paused, restore it in the Supabase dashboard.`);
      else { settings = await r.json(); done('ok', 'The project is up and the key is accepted.'); }
    } catch {
      (await reach(U + '/auth/v1/health'))
        ? done('bad', 'The server answers, but the browser blocked the reply. Turn off ad-blockers or privacy extensions for this page, or try another browser.')
        : done('bad', `This device cannot reach ${U.replace(/^https?:\/\//, '')} at all: no internet, a firewall or VPN, a blocked network, or a project that is paused. Open ${U}/auth/v1/health in a new tab. A short message such as "No API key found" means it is reachable. If that tab does not load either, the network is blocking it.`);
    }

    if (settings) {
      done = add('Registration is allowed');
      settings.disable_signup ? done('bad', 'Sign-ups are disabled. Enable them in Authentication → Providers → Email.') : done('ok');
      done = add('"Confirm email" is turned off');
      settings.mailer_autoconfirm ? done('ok', 'Accounts can sign in immediately.') : done('bad', 'Turn it off in Authentication → Providers → Email, otherwise registration never completes.');

      for (const [label, table] of [['Table "profiles" exists', 'profiles'], ['Table "photos" exists', 'photos']]) {
        done = add(label);
        try {
          const r = await fetch(`${U}/rest/v1/${table}?select=id&limit=1`, { headers: H }), j = await json(r);
          ['PGRST205', '42P01'].includes(j.code) || r.status === 404 ? done('bad', 'Not found. Run supabase-setup.sql once in Supabase → SQL Editor.') : done('ok');
        } catch { done('bad', 'Request failed. Check the network and try again.'); }
      }

      done = add('Admin functions are installed');
      try {
        const r = await fetch(`${U}/rest/v1/rpc/admin_member_stats`, { method: 'POST', headers: { ...H, 'Content-Type': 'application/json' }, body: '{}' }), j = await json(r);
        j.code === 'PGRST202' ? done('warn', 'Not visible to this key. If Members → Approve fails, run supabase-setup.sql again.') : done('ok', 'Members can be approved, blocked and removed by an admin.');
      } catch { done('warn', 'Could not check.'); }
    }

    done = add('Cloudinary cloud name and preset');
    try {
      const fd = new FormData(); if (CONFIG.CLOUDINARY_UPLOAD_PRESET) fd.append('upload_preset', CONFIG.CLOUDINARY_UPLOAD_PRESET);
      const r = await fetch(`https://api.cloudinary.com/v1_1/${CONFIG.CLOUDINARY_CLOUD_NAME}/image/upload`, { method: 'POST', body: fd }), j = await json(r), msg = j.error?.message || '';
      if (/cloud_?name|cloud name/i.test(msg)) done('bad', `Cloudinary says: ${msg}. Check CLOUDINARY_CLOUD_NAME.`);
      else if (/preset/i.test(msg)) done('bad', `Cloudinary says: ${msg}. Check the preset name, and that its Signing mode is "Unsigned".`);
      else done('ok', CONFIG.CLOUDINARY_UPLOAD_PRESET ? 'Cloudinary answered and did not reject the cloud name or preset. Nothing was uploaded, so your first photo is the final proof.' : 'Cloudinary answered. Uploads will be signed by the Edge Function.');
    } catch {
      (await reach('https://api.cloudinary.com/'))
        ? done('bad', 'Cloudinary answers, but the browser blocked the reply. Turn off ad-blockers or privacy extensions for this page, or try another browser.')
        : done('bad', 'This device cannot reach api.cloudinary.com at all (no internet, a firewall or VPN, or a blocked network). If Supabase failed in the same way, the cause is the network, not your settings.');
    }

    const needFn = !CONFIG.CLOUDINARY_UPLOAD_PRESET;
    done = add(`Edge Function "${CONFIG.EDGE_FUNCTION}" ${needFn ? '(required for signed uploads)' : '(optional)'}`);
    try {
      const r = await fetch(`${U}/functions/v1/${CONFIG.EDGE_FUNCTION}`, { method: 'POST', headers: { ...H, 'Content-Type': 'application/json' }, body: '{}' });
      r.status === 404 ? done(needFn ? 'bad' : 'warn', 'Not deployed. Deleting a photo then removes it from the app only, not from Cloudinary.') : done('ok', 'Deployed.');
    } catch { done(needFn ? 'bad' : 'warn', 'Not reachable (probably not deployed). Deleting a photo then removes it from the app only, not from Cloudinary.'); }

    const bad = rows.filter(r => r.s === 'bad').length, warn = rows.filter(r => r.s === 'warn').length;
    $('#chkSum').innerHTML = bad ? `<div class="chk-sum bad">${bad} problem${bad > 1 ? 's' : ''} to fix before it will work.</div>`
      : `<div class="chk-sum ok">Everything required is ready${warn ? ` (${warn} optional item${warn > 1 ? 's' : ''} to review)` : ''}.</div>`;
    $('#chkAgain').disabled = false;
  }
  $('#chkAgain').onclick = run;
  run();
}

async function loadProfile() {
  if (!S.session) return;
  const { data, error } = await sb.from('profiles').select('*').eq('id', S.session.user.id).maybeSingle();
  if (error) { console.error(error); S.profileErr = true; return; }
  S.profileErr = false; S.profile = data;
}

async function route() {
  clearTimers();
  if (!S.session) { S.profile = null; resetState(); renderAuth(); return; }
  await loadProfile();
  if (S.profileErr && !S.profile) return renderOffline();
  if (!S.profile) { await sb.auth.signOut(); return; }
  if (S.profile.status === 'approved') { renderApp(); timers.tick = setInterval(tick, 45000); refreshPending(); }
  else renderGate();
}

function resetState() {
  Object.assign(S, { view: 'gallery', scope: 'mine', photos: [], total: 0, hasMore: false, filterUser: '', selecting: false, members: [], stats: {}, pending: 0, memberTab: 'pending', memberQ: '' });
  S.selected.clear();
}

function renderOffline() {
  $('#app').innerHTML = `<div class="center"><div class="card gate"><div class="big bad">${icon('wifi')}</div><h2>Can't reach the server</h2><p>Check the internet connection, then try again.</p>
  <div class="row"><button class="btn primary" data-act="retry">${icon('refresh')} Try again</button><button class="btn" data-act="signout">Sign out</button></div></div></div>`;
}

let lastGate = '';
function renderGate() {
  closeOverlays(); clearInterval(timers.gate);
  const p = S.profile, blocked = p.status === 'blocked';
  lastGate = p.status;
  $('#app').innerHTML = `<div class="center"><div class="card gate">
    <div class="big ${blocked ? 'bad' : ''}">${icon(blocked ? 'alert' : 'clock')}</div>
    <h2>${blocked ? 'Access not available' : 'Waiting for approval'}</h2>
    <p>${blocked ? `Hi ${esc(p.full_name || p.username)}, your account <b>@${esc(p.username)}</b> does not currently have access. Please contact your administrator.`
      : `Hi ${esc(p.full_name || p.username)}, your account <b>@${esc(p.username)}</b> was created. An administrator needs to approve it first. This page updates automatically.`}</p>
    <div class="row"><button class="btn primary" data-act="gate-check">${icon('refresh')} Check now</button><button class="btn" data-act="signout">${icon('logout')} Sign out</button></div></div></div>`;
  timers.gate = setInterval(gateCheck, 8000);
}
async function gateCheck() {
  await loadProfile();
  if (S.profileErr) return;
  if (!S.profile) { sb.auth.signOut(); return; }
  if (S.profile.status === 'approved') route();
  else if (S.profile.status !== lastGate) renderGate();
}

async function tick() {
  if (!S.profile || document.hidden) return;
  const prev = S.profile;
  await loadProfile();
  if (S.profileErr) return;
  if (!S.profile) { sb.auth.signOut(); return; }
  if (S.profile.status !== prev.status || S.profile.role !== prev.role) { closeOverlays(); route(); return; }
  refreshPending();
}

async function signOut() {
  if (Q.items.some(i => ['queued', 'uploading', 'saving'].includes(i.state))) {
    if (!await confirmBox('Photos are still uploading', 'If you sign out now, unfinished uploads will be lost.', 'Sign out anyway', true)) return;
  }
  clearTimers(); closeOverlays();
  Q.items.forEach(i => { i.blob = null; }); Q.items = [];
  await sb.auth.signOut();
}

async function refreshPending() {

const okUrl = u => /^https:\/\/res\.cloudinary\.com\//.test(u || '');   // only ever render Cloudinary URLs
const tx = (url, t) => okUrl(url) ? url.replace('/upload/', `/upload/${t}/`) : '';
const isVideo = p => /\/video\/upload\//.test(p?.url || '');
// Cloudinary returns a still frame when a video URL ends in .jpg
const poster = (p, t) => tx(p.url, t).replace(/\.[a-z0-9]+$/i, '.jpg');
const thumb = (p, w = 420) => isVideo(p) ? poster(p, `c_fill,w_${w},h_${w},so_0,q_auto`) : tx(p.url, `c_fill,w_${w},h_${w},q_auto,f_auto`);
const midUrl = p => isVideo(p) ? poster(p, 'c_limit,w_900,h_900,so_0,q_auto') : tx(p.url, 'c_limit,w_900,h_900,q_auto,f_auto');
const viewUrl = p => isVideo(p) ? poster(p, 'c_limit,w_1600,h_1600,so_0,q_auto') : tx(p.url, 'c_limit,w_2400,h_2400,q_auto:best,f_auto');
const safeName = s => String(s).replace(/[^a-zA-Z0-9_-]/g, '_');
function fileName(p) {
  const d = new Date(p.created_at), z = n => String(n).padStart(2, '0');
  const who = p.profiles?.username || S.profile.username;
  return safeName(`${who}_${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`);
}
const originalUrl = p => tx(p.url, `fl_attachment:${fileName(p)}`);
function downloadPhoto(p) { const a = document.createElement('a'); a.href = originalUrl(p); a.download = ''; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); }

async function showGallery(scope) {
  S.scope = scope; S.photos = []; S.total = 0; S.hasMore = false;
  const all = scope === 'all';
  $('#view').innerHTML = `
    <div class="ph"><div><h1>${all ? 'All media' : 'My media'}</h1><p class="sub" id="gSub">&nbsp;</p></div>
      <div class="ph-actions">
        ${all ? `<select id="userFilter" class="input sel" aria-label="Filter by member"><option value="">Everyone</option></select>` : ''}
        <button class="btn" data-act="sel-mode">${icon('sel')}<span>Select</span></button>
        <button class="btn primary hide-sm" data-act="camera">${icon('camera')} Camera</button>
      </div></div>
    <div id="selbar"></div><div id="gBody"></div>`;
  if (all) {

async function deleteByIds(ids) {
  let cloud = false, failed = 0;
  try {
    const { data, error } = await sb.functions.invoke(CONFIG.EDGE_FUNCTION, { body: { action: 'delete', photo_ids: ids } });
    if (!error && data?.ok) { cloud = true; failed = data.cloud_failed || 0; }
  } catch (e) { /* function not deployed → fall back below */ }

  return { cloud, failed };
}
async function removePhotos(list) {

  const gone = new Set(ids);
  S.photos = S.photos.filter(p => !gone.has(p.id)); S.total = Math.max(0, S.total - ids.length);
  ids.forEach(id => S.selected.delete(id));

function camError(e) {

  if (n === 'NotAllowedError' || n === 'SecurityError') { t = 'Camera access was blocked.'; hint = 'Allow camera access for this site in the browser settings, then try again.'; }
  else if (n === 'NotFoundError' || n === 'DevicesNotFoundError') { t = 'No camera found on this device.'; }
  else if (n === 'NotReadableError' || n === 'TrackStartError') { t = 'The camera is being used by another app.'; hint = 'Close other apps that use the camera and try again.'; }

const VIDEO_TYPES = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];

}

  try {
    const i192 = drawIcon(192), i512 = drawIcon(512), base = location.href.split('#')[0].split('?')[0];
    const mf = { name: APP, short_name: APP, start_url: base, scope: base.replace(/[^/]*$/, ''), display: 'standalone', orientation: 'any', background_color: '#0a0e1a', theme_color: '#4f46e5',
      icons: [{ src: i192, sizes: '192x192', type: 'image/png', purpose: 'any' }, { src: i512, sizes: '512x512', type: 'image/png', purpose: 'any' }] };
    const l = document.createElement('link'); l.rel = 'manifest'; l.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' })); document.head.appendChild(l);
    const a = document.createElement('link'); a.rel = 'apple-touch-icon'; a.href = drawIcon(180); document.head.appendChild(a);
    const f = document.createElement('link'); f.rel = 'icon'; f.href = drawIcon(64); document.head.appendChild(f);
  } catch (e) { console.warn('PWA setup skipped', e); }
}

/* =====================================================================
   13. BOOT
   ===================================================================== */
async function boot() {
  setupPWA();
  if (typeof window.supabase === 'undefined') return renderSetup('The Supabase library could not be loaded. Check the internet connection and reload.');
  if (missing.length) return renderSetup();
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  buildCamera(); buildLightbox();
  const { data } = await sb.auth.getSession();
  S.session = data.session; let routedUid = data.session?.user?.id ?? null;
  sb.auth.onAuthStateChange((evt, session) => {
    S.session = session;
    if (['TOKEN_REFRESHED', 'USER_UPDATED', 'PASSWORD_RECOVERY'].includes(evt)) return;
    const uid = session?.user?.id ?? null;
    if (uid === routedUid) return;
    routedUid = uid; lastGate = ''; setTimeout(route, 0);   // never await Supabase calls inside this callback
  });
  route();
}
boot();
})();
